# prokrypt fork only: every push to no-auto-writes cuts a release. It dispatches main_matrix.yml, whose
# release jobs run only on workflow_dispatch; that build creates the release and publishes it when every arch is up.
name: Fork auto release

on:
  push:
    branches: [no-auto-writes]
    # Changes that can't alter the firmware don't need a 1.5 h build.
    paths-ignore:
      - "**.md"
      - .github/**
      - test/**

permissions:
  actions: write

jobs:
  dispatch:
    if: github.repository_owner == 'prokrypt'
    runs-on: ubuntu-26.04
    steps:
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main_matrix.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f nightly=false
